exclude: ^(\.github/PULL_REQUEST_TEMPLATE\.md|CLAUDE\.md)$

repos:
  - repo: local
    hooks:
      - id: swiftformat
        name: Check Swift formatting
        language: system
        entry: mise exec -- swiftformat --lint --config .swiftformat --cache ignore
        types: [swift]
        files: ^(Package\.swift|Sources/AirPodsControl/.*\.swift|Tests/AirPodsControlTests/.*\.swift)$

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.52
    hooks:
      - id: rumdl
        args: [--deny-config-warnings]
      - id: rumdl-fmt
        args: [--deny-config-warnings]
