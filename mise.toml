[tools]
pre-commit = "4.6.2"
rumdl = "0.2.52"
swiftformat = "0.63.0"

[tasks.format]
description = "Format Swift whitespace"
run = "make format"

[tasks.format-check]
description = "Check Swift whitespace"
run = "make format-check"

[tasks.markdown-check]
description = "Check Markdown"
run = "rumdl check . --deny-config-warnings"

[tasks.markdown-format]
description = "Format Markdown"
run = "rumdl fmt . --deny-config-warnings"

[tasks.test]
description = "Build and run tests"
run = "make test"
