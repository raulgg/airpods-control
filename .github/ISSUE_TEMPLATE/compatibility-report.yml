name: Compatibility report
description: Share a privacy-reviewed AirPods compatibility snapshot (Beats reports are exploratory).
title: "[Compatibility] "
labels:
  - compatibility
assignees:
  - raulgg
body:
  - type: markdown
    attributes:
      value: |
        Connect exactly one compatible AirPods or Beats device and run `airpods-control support-report`.
        Review the report locally before pasting or submitting it. Do not add a custom device name,
        serial number, Bluetooth/MAC address, account information, or raw system logs or dumps.

  - type: textarea
    id: report
    attributes:
      label: Compatibility report
      description: Paste the GitHub report generated by `airpods-control support-report`. The CLI prefills this field when the report fits safely in a URL.
      placeholder: |
        - Device family: AirPods
        - Model: AirPods Pro 3
        - Model identifier: `BTHeadphones76,8231` (Bluetooth product ID 0x2027)
        - macOS: 26.1.0
        - airpods-control: 0.1.0
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add any other compatibility details that are safe to publish.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and confirmed it contains no custom device name, serial number, Bluetooth/MAC address, account information, or raw system logs or dumps.
          required: true
