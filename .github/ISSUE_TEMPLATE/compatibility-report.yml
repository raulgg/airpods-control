name: Compatibility report
description: Share a privacy-reviewed AirPods compatibility snapshot (Beats reports are exploratory).
title: "[Compatibility] "
labels:
  - compatibility
assignees:
  - raulgg
body:
  - type: markdown
    attributes:
      value: |
        Connect exactly one compatible AirPods or Beats device and run `airpods-control support-report`. Review the report locally before submitting it. The privacy confirmation below lists what the report must not contain.

  - type: textarea
    id: report
    attributes:
      label: Compatibility report
      description: The CLI normally prefills this field. If it prints a `GitHub report` block instead, paste that block here; otherwise use the scaffold for manual entry.
      placeholder: |
        #### Device

        - Model:
        - Model identifier:
        - Device family:
        - macOS:
        - airpods-control:

        #### Capabilities

        - Advertised known listening modes:
        - Other advertised listening modes:
        - Listening-mode query:
        - Listening-mode setter:
        - Conversation Awareness capability:
        - Conversation Awareness query:
        - Conversation Awareness setter:

        #### Write tests

        - Status:
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add any other compatibility details that are safe to publish.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and confirmed it contains no custom device name, firmware version, serial number, Bluetooth/MAC address, account data, or raw system dumps and logs.
          required: true
