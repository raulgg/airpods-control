name: Bug report
description: Report a reproducible problem or macOS compatibility regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use the Security vulnerability link on the issue chooser.

  - type: input
    id: version
    attributes:
      label: airpods-control version
      description: Run `airpods-control --version`, or provide the commit hash.
      placeholder: 0.2.0
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 26.0
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Device model
      placeholder: AirPods Pro (2nd generation) or Beats Studio Pro
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and terminal output
      description: Include the command, stdout, stderr, and exit code. Redact device names and other personal information.
      render: console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: Debug diagnostics
      description: Re-run with `--debug` and paste stderr. Redact device names and other personal information.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain sensitive vulnerability details.
          required: true
