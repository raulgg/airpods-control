name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rumdl:
    name: rumdl
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0
        with:
          version: "0.2.52"
          report-type: annotations
          args: --deny-config-warnings
