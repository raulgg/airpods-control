name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rumdl:
    name: rumdl
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Markdown
        uses: rvben/rumdl@v0
        with:
          version: "0.2.52"
          report-type: annotations
          args: --deny-config-warnings
