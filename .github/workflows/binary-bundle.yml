name: Experimental Binary Bundle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build and verify universal bundle (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-26
          - architecture: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build package
        id: package
        run: |
          make package
          ./Tests/PackagingTests/bypass-runtime.sh \
            build/airpods-control build/avbypass.dylib
          echo "version=$(cat version.txt)" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=12 HEAD)" >>"$GITHUB_OUTPUT"

      - name: Verify package
        run: |
          archive="dist/airpods-control-${{ steps.package.outputs.version }}-macos-universal.tar.gz"
          (cd dist && shasum -a 256 -c SHA256SUMS)
          grep -Fx "commit=$(git rev-parse HEAD)" dist/BUILD.txt
          ./scripts/verify-binary-package.sh "$archive"

      - name: Upload experimental artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-airpods-control-${{ steps.package.outputs.version }}-${{ steps.package.outputs.commit }}-${{ matrix.architecture }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/BUILD.txt
          if-no-files-found: error
          retention-days: 7
