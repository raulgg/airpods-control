name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-automation
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Require a published GitHub release for version.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '[:space:]' <version.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version.txt: $version" >&2
            exit 1
          fi

          manifest_version=$(jq -r '.["."]' .release-please-manifest.json)
          if [ "$manifest_version" != "$version" ]; then
            echo "version.txt ($version) does not match manifest ($manifest_version)" >&2
            exit 1
          fi

          tag="v$version"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false

          tag_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)
          comparison=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$tag_sha...$GITHUB_SHA" --jq .status)
          case "$comparison" in
            ahead | identical) ;;
            *)
              echo "Release tag $tag is not on this protected main history" >&2
              exit 1
              ;;
          esac

  tap-dispatch:
    name: Validate release and notify Homebrew tap
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: tap-dispatch

    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false

          tag_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha)
          comparison=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$tag_sha...$GITHUB_SHA" --jq .status)
          case "$comparison" in
            ahead | identical) ;;
            *)
              echo "Release tag $RELEASE_TAG is not on this protected main history" >&2
              exit 1
              ;;
          esac

      - name: Notify Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run update-formula.yml \
            --repo raulgg/homebrew-tap \
            --ref main \
            -f "tag=$RELEASE_TAG"

  binary-release:
    name: Publish optional binary assets
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      vars.PUBLISH_BINARY_RELEASES == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/binary-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      publish: true
